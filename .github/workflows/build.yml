name: Build

# MX4200 v1-only (512 MiB RAM, 6 MiB kernel partition).
# Keep upstream ppe-nss with NSS Wi-Fi offload.
on:
  workflow_dispatch:
  # Only what goes into an image: the site, prune and stats scripts do not.
  push:
    branches: [main]
    paths:
      - 'devices/**'
      - 'patches/**'
      - 'scripts/prepare-build.sh'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-flavour.yml'
  # Once a day, and only when a source moved: a full build of every group costs
  # 500 to 1500 runner minutes, and auto-updating routers take one release a day.
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  ppe-nss:
    uses: ./.github/workflows/build-flavour.yml
    secrets: inherit
    with:
      upstream_repo: JuliusBairaktaris/openwrt-ppe-nss
      upstream_ref: ppe-nss
      nss_repo: JuliusBairaktaris/nss-packages
      nss_ref: ppe-nss
      variant: ppe-nss
      release_prefix: ppe-nss
      title: OpenWrt PPE NSS - MX4200 v1
      # This group now contains only the MX4200 v1 device profile.
      devices: '["ipq807x-6m-kernel"]'
      # nss-firmware, and the luci fork carrying luci-app-qca-ppe-qos (openwrt/luci PR 8965),
      # which prepare-build.sh swaps in for the default luci feed.
      feeds: |
        src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;ppe-nss
        src-git luci https://github.com/JuliusBairaktaris/luci.git;luci-app-ppe-qos
      notes: |
        Linksys MX4200 v1 (512 MiB RAM) only. Use the matching
        linksys_mx4200v1 sysupgrade image on existing OpenWrt.
        Do not flash this image onto MX4200 v2, MX5300 or MX8500.
        Includes RX ring memory optimization and native kernel BTF.
        The FIT kernel must fit the 6 MiB partition or the build fails.

        Wired offload runs in the PPE through the fw4 flowtable, switchdev
        and tc. The NSS Wi-Fi offload is on by default; turn it off with
        `uci set nss-wifi.general.offload=0; uci commit nss-wifi; reboot`.

        The images carry NSS firmware 12.5 and 11.4 and boot 12.5. 802.11s
        mesh needs 11.4, the last line that accepts a mesh interface:
        `uci set nss-wifi.general.firmware=11.4; uci commit nss-wifi; reboot`.
