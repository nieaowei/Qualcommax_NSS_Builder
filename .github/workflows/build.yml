name: Build Linksys NSS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'devices/**'
      - 'files/**'
      - 'patches/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: nss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.device }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device: [mx4200v1, mx5300]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bzip2 clang flex bison gawk gcc git \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            make patch python3 rsync unzip wget curl file xz-utils \
            gettext cmake ninja-build pkg-config
      - name: Compile firmware
        env:
          JOBS: '4'
        run: bash scripts/build-local.sh "${{ matrix.device }}"
      - name: Upload sysupgrade image
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.device }}
          path: output/${{ matrix.device }}/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Release both images
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' -t images < <(find dist -type f -name '*squashfs-sysupgrade.bin' -print0)
          [[ ${#images[@]} -eq 2 ]] || { echo 'Expected two images' >&2; exit 1; }
          mapfile -d '' -t assets < <(find dist -type f \( -name '*.bin' -o -name 'sha256sums-*.txt' -o -name 'config-*.buildinfo' \) -print0)
          tag="nss-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Linksys NSS: MX4200 v1 and MX5300' \
            --notes 'Two OpenWrt NSS 12.5 sysupgrade images. MX4200 v1 uses 512MB ath11k profile and experimental RX-ring tuning; MX5300 uses 1GB profile. Flash only on matching hardware.'
